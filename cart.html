<!DOCTYPE html>
<html>
<head>
  <title>Your Cart</title>
  <link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2 style="padding:20px;">Your Cart 🛒</h2>
<button class="back-btn" onclick="history.back()">← Continue Shopping</button>
<div id="cartItems"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let box = document.getElementById("cartItems");

function renderCart() {
  box.innerHTML = "";

  if (cart.length === 0) {
    box.innerHTML = "<p style='padding:20px;'>Cart is empty 😅</p>";
    return;
  }

  cart.forEach((p, i) => {
    box.innerHTML += `
      <div class="cart-card">
        <img src="${p.image}" alt="${p.name}" class="cart-img">

        <div class="cart-info">
          <h3 class="cart-title">${p.name}</h3>
          <p class="cart-price">₹${p.price}</p>

          <div class="cart-actions">
            <button class="remove-btn" onclick="removeItem(${i})">❌ Remove</button>
            <a href="${p.link}" target="_blank" class="buy-btn">Buy Now</a>
          </div>
        </div>
      </div>
    `;
  });
}

function removeItem(i) {
  cart.splice(i, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart(); // 🔥 THIS is the fix
}

renderCart(); // initial render
</script>

<footer class="cart-footer">
  <a href="index.html" class="footer-home-btn">🏠 Go to Home</a>
</footer>

</body>
</html>
